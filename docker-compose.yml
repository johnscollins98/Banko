# used for local testing only
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bank_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/bank_app
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npx prisma@6.6.0 migrate deploy && node server.js"]

volumes:
  postgres_data:
